name: Security CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "dokploy-compose.yml"
      - ".github/workflows/security-ci.yml"
  push:
    branches:
      - main
      - "security/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "dokploy-compose.yml"
      - ".github/workflows/security-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose files
        env:
          COMPOSE_DISABLE_ENV_FILE: "true"
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f dokploy-compose.yml config --quiet

      - name: Validate nginx security config
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build:prod

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  backend:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --strict

      - name: Compile backend sources
        run: python -m compileall backend/app backend/alembic
